#To have a shell console on UART
CONFIG_SHELL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

#Tracing tools
#CONFIG_TRACING=y
#CONFIG_TRACING_USER=y
#CONFIG_THREAD_NAME=y

#CONFIG_TRACING_CTF=y
#CONFIG_TRACING_BACKEND_RAM=y
#8192
#CONFIG_RAM_TRACING_BUFFER_SIZE=8192

#Avoid disturbant threads we are no focussing on.
#CONFIG_TRACING_ISR=n
#CONFIG_TRACING_SEMAPHORE=n

# The philips,pcd8544 display driver is not in this version of Zephyr
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LOG=y

## Networking General & Sockets
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
#For Auto-DHCP Helper
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# Networking Stack Buffers (increase defaults for Wi-Fi/DHCP)
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

# Enable Wi-Fi Subsystem
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_INF=y

# SNTP & POSIX Time Support
CONFIG_SNTP=y
# POSIX_API=y fails on build flash which fails to rebuild
#CONFIG_POSIX_API=y

# Network Shell (optional, great for debugging Wi-Fi connections via terminal)
#CONFIG_NET_SHELL=y

# Allocate system heap memory pool required by the network/Wi-Fi stack
CONFIG_HEAP_MEM_POOL_SIZE=49152

#CONFIG_ESP_HEAP_RUNTIME
#HARDWARE CONFIG -> ESP32 WiFi Config
CONFIG_ESP_WIFI_HEAP_SYSTEM=y

#We need to make a scan of the network with signal
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Enable DNS Name Resolution - To resolve the sntp address
CONFIG_DNS_RESOLVER=y
# Optional: Provide robust public fallback DNS servers (Google/Cloudflare)
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_DNS_SERVER2="1.1.1.1"

# Enable POSIX clock and time support (provides gettimeofday required by C's time())
CONFIG_POSIX_API=y
CONFIG_POSIX_CLOCK=y



